services:
  db:
    image: postgres:16-alpine
    container_name: akv_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=384MB
      - -c
      - max_connections=30
    mem_limit: 512m
    mem_reservation: 256m
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - akv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE}
    container_name: akv_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8787
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      APP_MASTER_KEY: ${APP_MASTER_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-19456}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-2}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 384m
    mem_reservation: 192m
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: ${WEB_IMAGE}
    container_name: akv_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    mem_limit: 128m
    mem_reservation: 64m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  akv_pgdata:
