services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-akv}
      POSTGRES_USER: ${POSTGRES_USER:-akv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=30]
    volumes:
      - akv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    pids_limit: 200
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  api:
    image: ${API_IMAGE:?Set API_IMAGE to a verified Vault 2.0 image digest}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS APP_ORIGIN in .env}
      APP_MASTER_KEY: ${APP_MASTER_KEY:?Set random APP_MASTER_KEY in .env}
      APP_LEGACY_MASTER_KEY: ${APP_LEGACY_MASTER_KEY:-}
      APP_PREVIOUS_KEYS: ${APP_PREVIOUS_KEYS:-[]}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      STORAGE_ROOT: /srv/vault
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-10737418240}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      DISK_RESERVE_BYTES: ${DISK_RESERVE_BYTES:-268435456}
      SESSION_SECONDS: ${SESSION_SECONDS:-86400}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-1800}
    volumes:
      - vault_files:/srv/vault
    mem_limit: 512m
    pids_limit: 200
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to a verified Vault 2.0 image digest}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    volumes:
      - vault_files:/srv/vault:ro
    mem_limit: 128m
    pids_limit: 100
    logging: *logging
volumes:
  akv_pgdata:
  vault_files:
