server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
  # HTTPS terminates at a trusted reverse proxy; bind published port to loopback.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "private, max-age=31536000, immutable";
  }
  location /api/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store, private" always;
  }
  location /_private_objects/ {
    internal;
    alias /srv/vault/objects/;
    disable_symlinks on;
    sendfile on;
    gzip off;
    max_ranges 1;
    etag off;
    add_header Cache-Control "no-store, private" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "sandbox; default-src 'none'" always;
  }
}
