[package]
name = "apikey-vault"
version = "1.0.0"
description = "API Key 保险箱 - 安全的密钥管理工具"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 数据库和加密
rusqlite = { version = "0.31.0", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.5.3"
rand = "0.8.5"
hex = "0.4.3"

# 文件操作
tokio = { version = "1.36", features = ["fs"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
