name: Docker Images

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image names
        id: vars
        run: |
          OWNER_LOWER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "api_image=${REGISTRY}/${OWNER_LOWER}/apikey-vault-api" >> "$GITHUB_OUTPUT"
          echo "web_image=${REGISTRY}/${OWNER_LOWER}/apikey-vault-web" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ steps.vars.outputs.api_image }}:${{ github.sha }}
            ${{ steps.vars.outputs.api_image }}:master-latest

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ steps.vars.outputs.web_image }}:${{ github.sha }}
            ${{ steps.vars.outputs.web_image }}:master-latest
