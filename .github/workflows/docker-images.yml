name: Docker Images

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vault_test
          POSTGRES_USER: vault_test
          POSTGRES_PASSWORD: ci-ephemeral-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vault_test -d vault_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://vault_test:ci-ephemeral-test-password@127.0.0.1:5432/vault_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm test
      - run: pnpm build
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
  build-images:
    needs: validate
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image names
        id: vars
        run: |
          OWNER_LOWER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "api_image=${REGISTRY}/${OWNER_LOWER}/apikey-vault-api" >> "$GITHUB_OUTPUT"
          echo "web_image=${REGISTRY}/${OWNER_LOWER}/apikey-vault-web" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ steps.vars.outputs.api_image }}:${{ github.sha }}
            ${{ steps.vars.outputs.api_image }}:master-latest

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ steps.vars.outputs.web_image }}:${{ github.sha }}
            ${{ steps.vars.outputs.web_image }}:master-latest
